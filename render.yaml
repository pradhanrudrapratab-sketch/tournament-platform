services:
  - type: web
    name: crown-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: crown-arena-db
          property: connectionString
      - key: ROOM_CRED_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PAYMENT_GATEWAY_BASE_URL
        sync: false
      - key: PAYMENT_GATEWAY_API_KEY
        sync: false
      - key: PAYMENT_GATEWAY_WEBHOOK_SECRET
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
databases:
  - name: crown-arena-db
    plan: free
